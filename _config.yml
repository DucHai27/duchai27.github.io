# Cấu hình Theme & Ngôn ngữ
theme: jekyll-theme-chirpy
lang: vi
timezone: Asia/Ho_Chi_Minh

# Thông tin cá nhân hiển thị ở Sidebar trái
title: Nguyễn Đức Hải
tagline: IT & AI Student | Cloud, DevOps & Cybersecurity Enthusiast
description: >-
  Blog cá nhân và Portfolio của Nguyễn Đức Hải - Nơi chia sẻ kiến thức về
  Cloud Engineering, DevOps, Cybersecurity, Thuật toán và các dự án công nghệ.

# Đường dẫn chính của trang web (Thay bằng username GitHub của cậu)
url: "https://YOUR_GITHUB_USERNAME.github.io"
baseurl: ""

github:
  username: YOUR_GITHUB_USERNAME

social:
  name: Nguyễn Đức Hải
  email: your_email@gmail.com # Điền email của cậu
  links:
    - https://github.com/YOUR_GITHUB_USERNAME
    - https://www.linkedin.com/in/your-profile

# Giao diện: Cố định Dark Mode giống trang mẫu (hoặc xóa dòng này nếu muốn có nút bật/tắt Sáng-Tối)
theme_mode: dark

# Ảnh đại diện (Có thể dùng link ảnh trực tiếp từ GitHub hoặc để ảnh trong thư mục /assets/img/)
avatar: "https://github.com/YOUR_GITHUB_USERNAME.png"

# Bật sẵn Mục lục (TOC), Công thức toán và Sơ đồ
toc: true
paginate: 10

comments:
  provider: # Có thể điền 'giscus' sau này nếu muốn bật bình luận bằng GitHub

pwa:
  enabled: true
  cache:
    enabled: true

# Cấu hình mặc định của Chirpy (Giữ nguyên không sửa)
kramdown:
  footnote_backlink: "&#8617;&#xfe0e;"
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    css_class: highlight
    span:
      line_numbers: false
    block:
      line_numbers: true
      start_line: 1

collections:
  tabs:
    output: true
    sort_by: order

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true
      toc: true
      permalink: /posts/:title/
  - scope:
      path: _drafts
    values:
      comments: false
  - scope:
      path: ""
      type: tabs
    values:
      layout: page
      permalink: /:title/

sass:
  style: compressed

compress_html:
  clippings: all
  comments: all
  endings: all
  profile: false
  blanklines: false
  ignore:
    envs: [development]

exclude:
  - "*.gem"
  - "*.gemspec"
  - docs
  - tools
  - README.md
  - LICENSE
  - "*.config.js"
  - "package*.json"

jekyll-archives:
  enabled: [categories, tags]
  layouts:
    category: category
    tag: tag
  permalinks:
    tag: /tags/:name/
    category: /categories/:name/
